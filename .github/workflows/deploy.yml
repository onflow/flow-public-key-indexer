name: "CI"

# After the sslmode fix (#21, 2026-11-25) the default is `KEYIDX_POSTGRESQLSSL=true`,
# which this workflow's Postgres service container cannot satisfy — set it to false just
# for CI.
#
# The build / deploy-staging / deploy-production jobs that pushed to GCP Artifact Registry
# and rolled Cloud Run were removed in the same change: the GCP Cloud Run service is being
# decommissioned in favour of the AWS ECS Fargate deployment in the flow-wallet AWS account
# (onflow/ff-wallet-infrastructure terraform/aws-devex-services/). A new workflow targeting
# AWS ECR + ECS will land separately once the cutover is scheduled.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Pin to 22.04 (gcc 11, C17 default). ubuntu:latest now ships gcc 14, which rejects
    # `typedef _Bool bool` in onflow/crypto's bls12381_utils.h because `bool` is a
    # reserved keyword under C23.
    container: ubuntu:22.04
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: keyindexer
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Install CA certificates
        run: |
          apt-get update
          apt-get install -y ca-certificates
          update-ca-certificates
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Install dependencies
        run: go mod tidy
      - name: Install GCC and libc headers
        # libc6-dev provides stdlib.h etc. The removed build job had it; this one was missing it.
        run: |
          apt-get update
          apt-get install -y gcc libc6-dev
      - name: Run tests
        env:
          KEYIDX_POSTGRESQLHOST: postgres
          KEYIDX_POSTGRESQLPORT: 5432
          KEYIDX_POSTGRESQLUSERNAME: postgres
          KEYIDX_POSTGRESQLPASSWORD: password
          KEYIDX_POSTGRESQLDATABASE: keyindexer
          KEYIDX_POSTGRESQLSSL: "false"
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
          CC: gcc
          CGO_CFLAGS: "-O2 -D__BLST_PORTABLE__"
        run: go test ./... -v
